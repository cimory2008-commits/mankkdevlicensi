<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>4Mankkdev License</title>
<link rel="icon" href="/logo.png">
<style>
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0b0b0f;color:#ecedf3}
:root{--panel:#14141b;--line:#262633;--mut:#8b8d9c;--acc:#6ea8ff;--bad:#ff5d6c;--ok:#3ddc97}
header{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);background:#101016;position:sticky;top:0;z-index:5}
header img{height:34px}
header .sp{flex:1}
main{max-width:1100px;margin:0 auto;padding:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
h2{margin:0 0 12px;font-size:16px}
input,textarea{background:#0d0d13;border:1px solid var(--line);border-radius:8px;color:inherit;padding:9px 11px;font:inherit;width:100%}
input:focus,textarea:focus{outline:none;border-color:var(--acc)}
textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;resize:vertical}
input[type=color]{padding:2px;height:38px}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row input{flex:1;min-width:140px}
.btn,.sm{background:var(--acc);color:#07101f;border:0;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
.sm{background:#23232f;color:#ecedf3;padding:5px 10px;font-size:12px;font-weight:500;margin:2px}
.sm:hover{background:#2e2e3d}.sm.danger{color:var(--bad)}
.mut{color:var(--mut)}code{font-family:ui-monospace,Menlo,Consolas,monospace;background:#0d0d13;padding:2px 6px;border-radius:6px;font-size:12px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--mut);font-weight:500}
.lim{width:64px;padding:4px 6px;display:inline-block}
.chip{display:inline-flex;gap:6px;align-items:center;background:#1d1d28;border:1px solid var(--line);border-radius:999px;padding:2px 10px;margin:2px;font-family:ui-monospace,monospace;font-size:12px}
.chip a{cursor:pointer;color:var(--bad);font-weight:700}
.b{padding:2px 8px;border-radius:999px;font-size:12px}.b.ok{background:#12301f;color:var(--ok)}.b.bad{background:#341319;color:var(--bad)}
.tabs{display:flex;gap:6px;margin-bottom:16px}
.tabs a{padding:8px 16px;border-radius:8px;cursor:pointer;color:var(--mut)}.tabs a.on{background:var(--panel);color:#fff;border:1px solid var(--line)}
.key{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.key code{font-size:15px;padding:6px 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.login{max-width:360px;margin:12vh auto;text-align:center}.login img{width:240px;max-width:80%;margin-bottom:16px}.login input{margin:6px 0}
.err{color:var(--bad);min-height:20px;margin-top:8px}
.pv{background:radial-gradient(circle at 30% 20%,#1b1b27,#09090d);border:1px solid var(--line);border-radius:10px;aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;padding:14px}
.pvc{background:#16161e;border:2px solid;border-radius:14px;padding:18px;width:100%;max-width:330px;text-align:center}
.pvc img{width:72px;height:72px;object-fit:contain}.pvc h3{margin:8px 0 6px;font-size:20px;letter-spacing:.5px}
.pvc p{margin:0 0 10px;color:#bec0cd;font-size:13px}.pvc small{color:#82849a;font-family:ui-monospace,monospace;display:block}
.pvc .pw{margin-top:10px;font-size:11px;color:#6e7080}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#23232f;border:1px solid var(--line);padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;z-index:20}
#toast.show{opacity:1}#toast.bad{border-color:var(--bad);color:var(--bad)}
ol{padding-left:18px;margin:10px 0 0}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S = JSON.parse(localStorage.getItem('mk') || 'null');
let U = null, tab = 'd';

function toast(m, bad) {
  const t = document.getElementById('toast');
  t.textContent = m; t.className = 'show' + (bad ? ' bad' : '');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.className = '', 2600);
}
async function api(path, data) {
  const r = await fetch('/api/' + path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', ...(S ? { Authorization: 'Bearer ' + S.token } : {}) },
    body: JSON.stringify(data || {}),
  });
  const j = await r.json().catch(() => ({ error: 'Respon server tidak valid' }));
  if (r.status === 401 && S) { logout(); }
  if (!r.ok) throw new Error(j.error || 'Terjadi kesalahan');
  return j;
}
function logout() { S = null; U = null; localStorage.removeItem('mk'); render(); }
function cp(t) { navigator.clipboard.writeText(t).then(() => toast('Disalin!')); }

function head() {
  return `<header><img src="/logo.png" alt="4Mankkdev"><span class="mut">License Panel · ${S.role === 'admin' ? 'Admin' : esc(S.username)}</span><span class="sp"></span><button class="sm" onclick="logout()">Logout</button></header>`;
}

/* ---------------- Login ---------------- */
function renderLogin() {
  app.innerHTML = `<div class="login card"><img src="/logo.png" alt="4Mankkdev">
    <input id="lu" placeholder="Username" autocomplete="username">
    <input id="lp" type="password" placeholder="Password" autocomplete="current-password">
    <button class="btn" style="width:100%;margin-top:8px" onclick="doLogin()">Masuk</button><div class="err" id="le"></div></div>`;
  document.getElementById('lp').addEventListener('keydown', e => e.key === 'Enter' && doLogin());
}
async function doLogin() {
  try {
    const j = await api('login', { username: lu.value, password: lp.value });
    S = j; localStorage.setItem('mk', JSON.stringify(S)); tab = 'd'; render();
  } catch (e) { document.getElementById('le').textContent = e.message; }
}

/* ---------------- Admin ---------------- */
async function renderAdmin() {
  const { users } = await api('admin', { action: 'list' });
  const rows = users.map(u => `<tr>
    <td><b>${u.username}</b><br><span class="mut">${new Date(u.createdAt).toLocaleDateString('id-ID')}</span></td>
    <td><code>${u.key}</code><br><button class="sm" onclick="cp('${u.key}')">Salin</button></td>
    <td>${u.universes.length} / <input class="lim" id="l_${u.username}" type="number" min="0" value="${u.limit}"><button class="sm" onclick="upd('${u.username}')">Simpan</button></td>
    <td>${u.universes.map(i => `<span class="chip">${i}<a onclick="rmU('${u.username}','${i}')">×</a></span>`).join('') || '<span class="mut">-</span>'}</td>
    <td>${u.disabled ? '<span class="b bad">Nonaktif</span>' : '<span class="b ok">Aktif</span>'}</td>
    <td><button class="sm" onclick="adm({action:'update',username:'${u.username}',disabled:${!u.disabled}})">${u.disabled ? 'Aktifkan' : 'Nonaktifkan'}</button>
    <button class="sm" onclick="resetKey('${u.username}')">Reset Key</button>
    <button class="sm" onclick="chPw('${u.username}')">Ganti Pass</button>
    <button class="sm danger" onclick="delUser('${u.username}')">Hapus</button></td></tr>`).join('');
  app.innerHTML = head() + `<main>
    <section class="card"><h2>Buat User Baru</h2>
      <div class="row"><input id="nu" placeholder="username (huruf kecil/angka/_)"><input id="np" placeholder="password (min 6)"><input id="nl" type="number" min="0" value="3" title="Limit Universe ID" style="max-width:110px"><button class="btn" onclick="mkUser()">Buat User</button></div>
      <p class="mut" style="margin:8px 0 0">Angka di kanan password = limit jumlah Universe ID yang boleh didaftarkan user.</p></section>
    <section class="card"><h2>Daftar User (${users.length})</h2><div class="tw"><table>
      <tr><th>User</th><th>License Key</th><th>Universe / Limit</th><th>Universe ID</th><th>Status</th><th>Aksi</th></tr>
      ${rows || '<tr><td colspan="6" class="mut">Belum ada user.</td></tr>'}</table></div></section></main>`;
}
async function adm(body, msg) {
  try { await api('admin', body); toast(msg || 'Berhasil'); renderAdmin(); } catch (e) { toast(e.message, 1); }
}
const mkUser = () => adm({ action: 'create', username: nu.value, password: np.value, limit: nl.value }, 'User dibuat');
const upd = u => adm({ action: 'update', username: u, limit: document.getElementById('l_' + u).value }, 'Limit disimpan');
const rmU = (u, id) => confirm('Hapus Universe ID ' + id + ' dari ' + u + '?') && adm({ action: 'removeUniverse', username: u, universeId: id });
const resetKey = u => confirm('Reset key ' + u + '? Script lama berhenti valid sampai user download ulang.') && adm({ action: 'resetkey', username: u }, 'Key direset');
const delUser = u => confirm('Hapus user ' + u + ' beserta semua Universe ID-nya?') && adm({ action: 'delete', username: u }, 'User dihapus');
const chPw = u => { const p = prompt('Password baru untuk ' + u + ' (min 6):'); if (p) adm({ action: 'update', username: u, password: p }, 'Password diganti'); };

/* ---------------- User ---------------- */
async function loadUser() {
  try { U = (await api('me', { action: 'get' })).user; show(); }
  catch (e) { if (S) { app.innerHTML = head() + `<main><div class="card">${esc(e.message)}</div></main>`; } }
}
function show() {
  app.innerHTML = head() + `<main><nav class="tabs">
    <a class="${tab === 'd' ? 'on' : ''}" onclick="tab='d';show()">Dashboard</a>
    <a class="${tab === 'e' ? 'on' : ''}" onclick="tab='e';show()">Editor Script</a></nav>` + (tab === 'd' ? dash() : editor()) + '</main>';
  if (tab === 'e') bindEditor();
}
function dash() {
  return `<section class="card"><h2>License Key</h2><div class="key"><code>${U.key}</code><button class="sm" onclick="cp('${U.key}')">Salin</button></div>
    <p class="mut" style="margin:8px 0 0">Key sudah tertanam otomatis di script yang kamu download.</p></section>
  <section class="card"><h2>Universe ID Game (${U.universes.length} / ${U.limit})</h2>
    <div class="row"><input id="uid" placeholder="Universe ID, contoh: 1234567890" inputmode="numeric"><button class="btn" onclick="addU()">Tambah</button></div>
    <div style="margin-top:10px">${U.universes.map(i => `<span class="chip">${i}<a onclick="delU('${i}')">×</a></span>`).join('') || '<span class="mut">Belum ada Universe ID.</span>'}</div>
    <p class="mut" style="margin:10px 0 0">Cari Universe ID: Creator Hub &rarr; Creations &rarr; pilih game, atau di Studio (game yang sudah dipublish) jalankan <code>print(game.GameId)</code> di Command Bar.</p></section>
  <section class="card"><h2>Download Script</h2>
    <a class="btn" href="/api/download?token=${encodeURIComponent(S.token)}">⬇ Download Script Lisensi (.lua)</a>
    <ol class="mut"><li>Buat <b>Script</b> baru di <b>ServerScriptService</b>, paste isi file .lua</li>
    <li>Game Settings &rarr; Security &rarr; aktifkan <b>Allow HTTP Requests</b></li>
    <li>Publish game, daftarkan Universe ID di atas</li>
    <li>Kalau belum terdaftar, semua player dikunci dan muncul layar "Akses Ditolak"</li></ol></section>`;
}
async function addU() { try { U = (await api('me', { action: 'addUniverse', universeId: uid.value })).user; toast('Universe ID ditambahkan'); show(); } catch (e) { toast(e.message, 1); } }
async function delU(id) { if (!confirm('Hapus Universe ID ' + id + '?')) return; try { U = (await api('me', { action: 'removeUniverse', universeId: id })).user; show(); } catch (e) { toast(e.message, 1); } }

/* ---------------- Editor + preview ---------------- */
function logoSrc(id) { return `https://www.roblox.com/asset-thumbnail/image?assetId=${encodeURIComponent(id)}&width=150&height=150&format=png`; }
function previewHTML(c) {
  const msg = (c.lockMessage || '').replace(/\{name\}/g, c.hubName || '');
  return `<div class="pv"><div class="pvc" style="border-color:${esc(c.accent)}">
    <img src="${logoSrc(c.logoId)}" onerror="this.onerror=null;this.src='/logo.png'">
    <h3 style="color:${esc(c.accent)}">${esc(c.lockTitle)}</h3><p>${esc(msg)}</p>
    <small>Universe ID: 1234567890</small><div class="pw">Powered by 4Mankkdev</div></div></div>`;
}
function editor() {
  const c = U.config;
  return `<div class="grid"><section class="card"><h2>Pengaturan Script</h2>
    <label>Nama (HubName)</label><input id="e_name" maxlength="40" value="${esc(c.hubName)}">
    <label>Logo Roblox (Asset ID)</label><input id="e_logo" inputmode="numeric" value="${esc(c.logoId)}">
    <label>Warna Aksen</label><input id="e_acc" type="color" value="${esc(c.accent)}">
    <label>Judul Layar Terkunci</label><input id="e_title" maxlength="40" value="${esc(c.lockTitle)}">
    <label>Pesan Layar Terkunci (<code>{name}</code> = nama)</label><textarea id="e_msg" rows="3" maxlength="300">${esc(c.lockMessage)}</textarea>
    <label>Source Code Kamu (jalan hanya setelah Universe ID terverifikasi; objek <code>Mankk.Config</code> tersedia)</label>
    <textarea id="e_code" rows="14" spellcheck="false">${esc(U.code)}</textarea>
    <p class="mut">Bagian lisensi (cek Universe ID, kunci player) ditambahkan otomatis oleh server saat download.</p>
    <button class="btn" onclick="saveEd()">Simpan</button></section>
    <section class="card"><h2>Preview</h2><p class="mut" style="margin-top:0">Tampilan di game jika <b>belum punya akses</b> ke Universe ID-nya:</p><div id="pvbox"></div>
    <p class="mut">Nama, logo, warna, dan pesan langsung aktif di game tanpa download ulang. Perubahan source code butuh download script lagi.</p></section></div>`;
}
const cfgNow = () => ({ hubName: e_name.value, logoId: e_logo.value, accent: e_acc.value, lockTitle: e_title.value, lockMessage: e_msg.value });
function bindEditor() {
  const upd = () => { document.getElementById('pvbox').innerHTML = previewHTML(cfgNow()); };
  ['e_name', 'e_logo', 'e_acc', 'e_title', 'e_msg'].forEach(id => document.getElementById(id).addEventListener('input', upd));
  upd();
}
async function saveEd() {
  try { U = (await api('me', { action: 'save', config: cfgNow(), code: e_code.value })).user; toast('Tersimpan'); show(); }
  catch (e) { toast(e.message, 1); }
}

/* ---------------- Router ---------------- */
function render() {
  if (!S) return renderLogin();
  if (S.role === 'admin') return renderAdmin().catch(e => toast(e.message, 1));
  return loadUser();
}
render();
</script>
</body>
</html>
